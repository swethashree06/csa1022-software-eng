apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, labels: {app: backend}}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: backend
          image: YOUR_DOCKERHUB_USER/guestbook-backend:1.0
          ports: [{containerPort: 5000}]
          env:
            - {name: DB_HOST, value: database}
            - {name: DB_NAME, valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_DB}}}
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_USER}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: db-credentials, key: POSTGRES_PASSWORD}}}
          readinessProbe: {httpGet: {path: /api/health, port: 5000}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: backend}
  ports: [{port: 5000, targetPort: 5000}]
