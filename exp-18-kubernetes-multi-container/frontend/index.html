<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Multi-container app</title></head>
<body style="font-family:sans-serif;max-width:560px;margin:3rem auto">
<h1>Guestbook (frontend → backend → database)</h1>
<form id="f"><input id="t" placeholder="Leave a message" required> <button>Send</button></form>
<ul id="l"></ul>
<script>
async function load(){const r=await (await fetch('/api/messages')).json();
  l.innerHTML=r.map(m=>'<li>'+m.text.replace(/</g,'&lt;')+'</li>').join('')}
f.onsubmit=async e=>{e.preventDefault();
  await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.value})});
  t.value='';load()};
load();
</script></body></html>
