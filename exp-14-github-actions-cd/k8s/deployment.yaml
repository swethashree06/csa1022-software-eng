apiVersion: apps/v1
kind: Deployment
metadata:
  name: cd-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: cd-demo}
  template:
    metadata:
      labels: {app: cd-demo}
    spec:
      containers:
        - name: cd-demo
          image: IMAGE_PLACEHOLDER   # replaced by the workflow
          ports: [{containerPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: cd-demo
spec:
  type: LoadBalancer
  selector: {app: cd-demo}
  ports: [{port: 80, targetPort: 8000}]
