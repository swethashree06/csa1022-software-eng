# Quick local Jenkins with Docker access:  docker compose -f docker-compose.jenkins.yml up -d
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    user: root
    ports: ["8081:8080", "50000:50000"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
