apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: jenkins-demo}
  template:
    metadata:
      labels: {app: jenkins-demo}
    spec:
      containers:
        - name: jenkins-demo
          image: YOUR_DOCKERHUB_USER/jenkins-demo:latest
          ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-demo
spec:
  type: LoadBalancer
  selector: {app: jenkins-demo}
  ports: [{port: 80, targetPort: 5000}]
